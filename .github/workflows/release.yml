name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build with PyInstaller
        run: pyinstaller djwerk.spec
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: djwerk-windows-x64
          path: dist/DJwerk.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0 libdbus-1-3 libx11-6 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrender1 libxtst6 libgl1
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build with PyInstaller
        run: pyinstaller djwerk.spec
      - name: Install AppImageTool
        run: |
          sudo wget -O /usr/local/bin/appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
      - name: Create AppImage
        run: |
          mkdir -p AppDir/usr/bin
          cp dist/DJwerk AppDir/usr/bin/djwerk
          echo "[Desktop Entry]" > AppDir/djwerk.desktop
          echo "Name=DJwerk" >> AppDir/djwerk.desktop
          echo "Exec=djwerk" >> AppDir/djwerk.desktop
          echo "Icon=djwerk" >> AppDir/djwerk.desktop
          echo "Type=Application" >> AppDir/djwerk.desktop
          echo "Categories=Audio;" >> AppDir/djwerk.desktop
          touch AppDir/djwerk.png
          cat <<EOF > AppDir/AppRun
          #!/bin/sh
          exec "\$HERE/usr/bin/djwerk" "\$@"
          EOF
          chmod +x AppDir/AppRun
          ARCH=x86_64 /usr/local/bin/appimagetool --appimage-extract-and-run AppDir/ dist/DJwerk-x86_64.AppImage
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: djwerk-linux-appimage
          path: dist/*.AppImage

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build with PyInstaller (Universal2)
        run: |
          # We use universal2 for macOS to support both Intel and Apple Silicon
          # PyInstaller handles this if we set target_arch
          pyinstaller djwerk.spec
      - name: Bundle into DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "DJwerk" \
            --window-pos 200 120 \
            --window-size 600 300 \
            --icon-size 100 \
            --icon "DJwerk.app" 175 120 \
            --app-drop-link 425 120 \
            "dist/DJwerk-macOS-Universal.dmg" \
            "dist/DJwerk.app" || true
          if [ ! -f "dist/DJwerk-macOS-Universal.dmg" ]; then
            cd dist && zip -r DJwerk-macOS-Universal.zip DJwerk.app && cd ..
          fi
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: djwerk-macos-universal
          path: |
            dist/*.dmg
            dist/*.zip
