name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build with PyInstaller
        run: pyinstaller djwerk.spec
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: djwerk-windows-x64
          path: dist/DJwerk.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0 libdbus-1-3 libx11-6 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrender1 libxtst6 libgl1
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build with PyInstaller
        run: pyinstaller djwerk.spec
      - name: Install AppImageTool
        run: |
          sudo wget -O /usr/local/bin/appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
      - name: Create AppImage
        run: |
          mkdir -p AppDir/usr/bin
          cp dist/DJwerk AppDir/usr/bin/djwerk
          echo "[Desktop Entry]" > AppDir/djwerk.desktop
          echo "Name=DJwerk" >> AppDir/djwerk.desktop
          echo "Exec=djwerk" >> AppDir/djwerk.desktop
          echo "Icon=djwerk" >> AppDir/djwerk.desktop
          echo "Type=Application" >> AppDir/djwerk.desktop
          echo "Categories=Audio;" >> AppDir/djwerk.desktop
          touch AppDir/djwerk.png
          cat <<EOF > AppDir/AppRun
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\$0")")"
          exec "\$HERE/usr/bin/djwerk" "\$@"
          EOF
          chmod +x AppDir/AppRun
          ARCH=x86_64 /usr/local/bin/appimagetool --appimage-extract-and-run AppDir/ dist/DJwerk-x86_64.AppImage
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: djwerk-linux-appimage
          path: dist/*.AppImage

  # macOS Silicon (Native ARM64)
  build-macos-silicon:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build with PyInstaller
        run: |
          export DJWERK_ARCH=arm64
          pyinstaller djwerk.spec
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: djwerk-macos-arm64
          path: dist/DJwerk.app

  # macOS Intel (x86_64 via Rosetta on macOS-14 runner)
  build-macos-intel:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install dependencies
        run: |
          # Use arch -x86_64 to force Intel architecture
          arch -x86_64 pip install -r requirements.txt
          arch -x86_64 pip install pyinstaller
      - name: Build with PyInstaller
        run: |
          export DJWERK_ARCH=x86_64
          arch -x86_64 pyinstaller djwerk.spec
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: djwerk-macos-x86_64
          path: dist/DJwerk.app
